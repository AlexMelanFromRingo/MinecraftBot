[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft_bot"
version = "0.3.0"
description = "Minecraft Java Edition bot/agent framework — Python reference implementation."
# (`readme = "../README.md"` would break `pip install -e python/` because
# pip/setuptools refuse paths outside the package root. The full README
# lives at repo root for git/GitHub consumers; here we keep a one-line
# inline description so editable installs work in CI containers.)
readme = { text = "Python reference implementation of the MinecraftBot framework. See repo README for full documentation.", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Melan" }]
keywords = ["minecraft", "bot", "agent", "protocol", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
# Constitution VI — zero runtime deps in core. Stdlib only.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "ruff>=0.5",
    "black>=24",
    # Wheel builder for python-ext/ (Constitution VI: dev-only, NOT a runtime dep).
    "maturin>=1.5,<2",
]

[project.urls]
Homepage = "https://github.com/AlexMelanFromRingo/MinecraftBot"
Issues = "https://github.com/AlexMelanFromRingo/MinecraftBot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["minecraft_bot*"]

[tool.pytest.ini_options]
testpaths = ["../tests/python"]
asyncio_mode = "auto"
markers = [
    "live: tests that require a reachable Paper 1.20.1 server (default 172.26.160.1:25565). Run with `pytest -m live`.",
    "slow: long-running tests (e.g., 10-minute uptime). Run with `pytest -m 'live and slow'`.",
]
filterwarnings = [
    "error::DeprecationWarning:minecraft_bot",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["minecraft_bot"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "RUF",          # ruff-specific
]
ignore = [
    "E501",  # line length (handled by formatter)
    "E702",  # multi-statement on one line (compact codec utilities)
    "F841",  # local var assigned but unused (test diagnostic snapshots)
    "B007",  # unused loop variable (legitimate enumerate idiom)
    "B011",  # assert False is fine in tests as an explicit fail
    "B027",  # empty abstract method (BehaviourNode.reset is a no-op hook by design)
    "B905",  # zip() without strict (Python <3.10 compat in some test files)
    "E402",  # module-level import not at top (per-file-locality is intentional in tests)
    "F821",  # forward-referenced symbols in TYPE_CHECKING blocks
    "RUF001", # ambiguous unicode in strings (× / ≥ used intentionally)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "RUF005", # collection-literal concat is sometimes more readable than unpack
    "RUF006", # dangling asyncio.create_task is intentional in some fire-and-forget paths
    "RUF012", # mutable class default for slots dataclasses
    "RUF021", # parenthesise or chains — style preference
    "RUF022", # __all__ grouped by concept, not alphabetised
    "RUF043", # pytest.raises pattern as plain string
    "RUF059", # unused unpacked variables for diagnostic clarity
    "UP007",  # non-PEP604 Optional[X] kept for Python 3.9 compat in shared dataclasses
    "UP015",  # explicit open mode "r"
    "UP032",  # explicit format-string when carrying intent
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
