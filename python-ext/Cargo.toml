[package]
name = "minecraft_bot_accel"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Alex Melan <cleverbotam@gmail.com>"]
description = "PyO3 façade over the minecraft_bot Rust crate — native-speed alternative to the Python reference."
license = "MIT"
repository = "https://github.com/AlexMelanFromRingo/MinecraftBot"

[lib]
name = "minecraft_bot_accel"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Path dependency on the standalone Rust framework crate (001 + 003 port).
minecraft_bot = { path = "../rust" }

# PyO3 stable-ABI extension. abi3-py311 means one wheel works for
# Python 3.11+ without re-build.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }

# Bridges tokio futures to asyncio coroutines.
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }

# Tokio reused from minecraft_bot's transitive dep set; pin features we
# need in this crate explicitly.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
