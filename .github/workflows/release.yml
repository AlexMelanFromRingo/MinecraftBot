name: Release (003)

# T064 — tag push triggers wheels.yml, then collects + uploads artefacts
# to the matching GitHub Release.

on:
  push:
    tags: ["v*"]

jobs:
  trigger-wheels:
    name: Build wheels
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read

  publish-release:
    name: Upload wheels to GitHub Release
    needs: trigger-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all wheel artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: List collected wheels
        run: ls -lh dist
      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: dist/*.whl
          body: |
            Pre-built ABI3 wheels of `minecraft_bot_accel`
            (PyO3 façade over the standalone Rust framework).

            One wheel per platform; each covers Python 3.11+.
